[project]
name = "journeygraph-ai"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "SQLAlchemy==2.1.8",
  "alembic==1.20.1",
  "pydantic==2.14.2",
  "PyJWT==2.15.1",
  "python-multipart==0.0.33",
  "httpx==0.28.1",
  "networkx==3.7",
  "langgraph==1.2.20",
  "langgraph-checkpoint-sqlite==3.1.3",
  "scikit-learn==1.9.1",
  "neo4j==6.4.1",
  "psycopg[binary]==3.3.8",
]

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.uv]
package = false

[tool.vercel.scripts]
build = "sh scripts/build-vercel.sh"

[tool.vercel.fastapi.static]
cdn = true
